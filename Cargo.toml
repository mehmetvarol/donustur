[package]
name = "donustur"
version = "0.1.1"
edition = "2024"
description = "Kendi sunucunda çalışan görsel/video/ses dönüştürücü (axum + ffmpeg + image)"
license = "MIT"
rust-version = "1.85"

[features]
default = []
heic = ["dep:libheif-rs"]

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
http = "1"
http-body-util = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
infer = "0.22"
mime_guess = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
image = { version = "0.25", features = ["avif"] }
webp = "0.3"
chrono = { version = "0.4", features = ["serde"] }
libheif-rs = { version = "3", optional = true, default-features = false, features = ["v1_17"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
