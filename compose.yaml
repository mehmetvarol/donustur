services:
  morphbox:
    build: .
    image: morphbox:latest
    container_name: morphbox
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - morphbox-data:/data
    environment:
      MORPHBOX_WORKERS: "2"          # eşzamanlı dönüşüm; CPU/2 iyi başlangıç
      MORPHBOX_TTL_MIN: "60"         # dosyalar kaç dakika sonra silinsin
      MORPHBOX_MAX_UPLOAD_MB: "2048"
      MORPHBOX_JOB_TIMEOUT_MIN: "30"
      # MORPHBOX_PASSWORD: "degistir-beni"   # açınca tüm API şifre ister
    # cpus: "4"      # kodlamayı sınırlamak istersen
    # mem_limit: 4g

volumes:
  morphbox-data:
