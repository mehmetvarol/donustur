services:
  donustur:
    build: .
    image: donustur:latest
    container_name: donustur
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - donustur-data:/data
    environment:
      DONUSTUR_WORKERS: "2"          # eşzamanlı dönüşüm; CPU/2 iyi başlangıç
      DONUSTUR_TTL_MIN: "60"         # dosyalar kaç dakika sonra silinsin
      DONUSTUR_MAX_UPLOAD_MB: "2048"
      DONUSTUR_JOB_TIMEOUT_MIN: "30"
      # DONUSTUR_PASSWORD: "degistir-beni"   # açınca tüm API şifre ister
    # cpus: "4"      # kodlamayı sınırlamak istersen
    # mem_limit: 4g

volumes:
  donustur-data:
